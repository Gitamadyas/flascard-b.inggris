<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard Bagian Tubuh</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: linear-gradient(135deg, #bae6fd, #fbcfe8, #fef08a); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; color: #1e293b; }
    h1 { color: #be185d; text-shadow: 2px 2px 0 #fff; margin-bottom: 6px; text-align: center; }
    .tabs { display: flex; gap: 10px; margin: 15px 0 20px; }
    .tab-btn { padding: 10px 20px; border-radius: 30px; border: 3px solid #fff; font-weight: bold; cursor: pointer; background: #e2e8f0; color: #475569; font-size: 15px; }
    .tab-btn.active { background: #f97316; color: #fff; }
    
    /* Flashcard */
    #card-box { width: 330px; max-width: 90vw; height: 390px; perspective: 1000px; cursor: pointer; }
    #card-inner { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; }
    #card-inner.flipped { transform: rotateY(180deg); }
    .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; border: 6px solid #fff; box-shadow: 0 12px 25px rgba(0,0,0,0.15); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 22px; text-align: center; background: #fff; }
    .back { background: #fef3c7; transform: rotateY(180deg); }
    .badge { padding: 4px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; background: #dbeafe; color: #1d4ed8; }
    .back .badge { background: #fee2e2; color: #b91c1c; }
    .word-main { font-size: 40px; font-weight: 800; }
    .sent-box { background: #fff; padding: 12px; border-radius: 14px; width: 100%; border: 2px solid #fde68a; }
    .controls { display: flex; gap: 10px; margin-top: 18px; }
    .btn { background: #3b82f6; color: #fff; border: none; padding: 10px 16px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 15px; }
    .btn-green { background: #10b981; }

    /* Game */
    #game-box { display: none; width: 100%; max-width: 680px; background: rgba(255,255,255,0.9); padding: 20px; border-radius: 24px; border: 4px solid #fff; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .slot { display: flex; align-items: center; gap: 10px; background: #f8fafc; border: 2px dashed #94a3b8; border-radius: 12px; padding: 6px 12px; cursor: pointer; min-height: 52px; }
    .slot.sel { border: 3px solid #f97316; background: #ffedd5; }
    .slot.ok { border: 3px solid #22c55e; background: #dcfce7; }
    .tile { padding: 12px; border-radius: 12px; color: #fff; font-weight: bold; text-align: center; cursor: pointer; font-size: 18px; }
    .tile.sel { outline: 4px solid #0f172a; }
    .tile.done { opacity: 0.3; pointer-events: none; }
    #msg { text-align: center; font-weight: bold; margin-top: 14px; font-size: 18px; min-height: 26px; }
  </style>
</head>
