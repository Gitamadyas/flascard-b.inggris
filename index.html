<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcard Bagian Tubuh (Body Parts) - Kelas 3 SD</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', sans-serif;
      user-select: none;
    }

    body {
      background: linear-gradient(135deg, #bae6fd 0%, #fbcfe8 50%, #fef08a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: #1e293b;
    }

    /* Header & Navigasi Mode */
    header {
      text-align: center;
      margin-bottom: 18px;
    }

    header h1 {
      font-size: 32px;
      color: #be185d;
      text-shadow: 2px 2px 0px #ffffff;
      margin-bottom: 6px;
    }

    header p {
      font-size: 16px;
      color: #334155;
      font-weight: 500;
    }

    .mode-switch {
      display: flex;
      gap: 12px;
      margin: 14px 0 22px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .mode-btn {
      padding: 10px 22px;
      border-radius: 50px;
      border: 3px solid #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #e2e8f0;
      color: #475569;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: #f97316;
      color: #ffffff;
      transform: scale(1.05);
    }

    /* ================= MODE 1: FLASHCARD ================= */
    #flashcard-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
    }

    .progress-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
      border: 2px solid #94a3b8;
      cursor: pointer;
      transition: 0.2s;
    }

    .dot.active {
      background: #f97316;
      border-color: #ffffff;
      transform: scale(1.25);
    }

    /* Kartu 3D Flip */
    .card-scene {
      width: 340px;
      height: 410px;
      max-width: 90vw;
      perspective: 1000px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.65s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 28px;
      border: 6px solid #ffffff;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px;
      text-align: center;
    }

    /* Sisi Depan Kartu (Bahasa Inggris + Gambar) */
    .card-front {
      background: #ffffff;
    }

    .badge-lang {
      background: #dbeafe;
      color: #1d4ed8;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }
